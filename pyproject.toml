[tool.ruff]
target-version = "py311"
exclude = [
  "evidence",
  ".benchmarks",
  ".pytest_cache",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length — script files inherited from pre-package era

[tool.ruff.lint.per-file-ignores]
"audit_battery.py" = ["F401"]  # intentional re-exports for test_parser.py compat
"rerun_arm.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
